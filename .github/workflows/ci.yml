name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: freight
          POSTGRES_USER: freight
          POSTGRES_PASSWORD: freight
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://freight:freight@localhost:5432/freight
      SECRET_KEY: test-secret-key-not-for-production
      REDIS_URL: redis://localhost:6379/0
      OTP_DEV_CODE: "000000"
      SMS_BACKEND: apps.accounts.sms.ConsoleSmsBackend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Run linter
        run: ruff check .

      - name: Validate OpenAPI schema
        run: python manage.py spectacular --validate --fail-on-warn

      - name: Run test suite
        run: pytest
